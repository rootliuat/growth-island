# [INPUT]: 依赖 /opt/growth-island/dist 静态产物、127.0.0.1:5174 Node API、TLS 证书与 htpasswd。
# [OUTPUT]: 对外提供 HTTPS Growth Island、同源 /api 代理、受控缓存和课堂访问保护。
# [POS]: deploy 的公网入口模板，是浏览器与单实例课堂 API 之间的安全边界。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

server {
    listen 80;
    server_name growth-island.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name growth-island.example.com;

    ssl_certificate /etc/letsencrypt/live/growth-island.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/growth-island.example.com/privkey.pem;

    root /opt/growth-island/dist;
    index index.html;

    auth_basic "Growth Island Classroom";
    auth_basic_user_file /etc/nginx/growth-island.htpasswd;

    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "microphone=(self)" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_buffering off;
    }

    location ~* ^/assets/.*\.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/assets/.*\.(?:avif|gif|glb|gltf|jpe?g|png|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
