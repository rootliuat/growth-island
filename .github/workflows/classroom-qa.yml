# [INPUT]: 依赖 package-lock.json、mock Provider、Playwright Chromium 与课堂 QA/preview 脚本
# [OUTPUT]: 对外提供手动或每日运行的非阻断课堂 QA，功能问题判红、渲染性能警告留档，并保留 14 天证据
# [POS]: .github/workflows 的独立课堂验收，不触发 pull_request，不成为 main 分支保护状态
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

name: Classroom QA

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Classroom QA coverage
        required: true
        default: full
        type: choice
        options:
          - full
          - fast

permissions:
  contents: read

concurrency:
  group: classroom-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classroom-qa:
    name: classroom-qa
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: rules
      SPEECH_PROVIDER: mock
      MOCK_ASR_TEXT: 我今天主动帮同学收玩具
      QA_PROFILE: ${{ inputs.profile || 'full' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run classroom QA
        id: trial
        continue-on-error: true
        shell: bash
        run: |
          if [[ "$QA_PROFILE" == "fast" ]]; then
            npm run qa:trial:fast
          else
            node scripts/qa-trial.mjs
          fi

      - name: Complete trial asset report
        id: trial-assets
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          if [[ "$QA_PROFILE" == "fast" ]]; then
            TRIAL_REQUIRED_RESULTS=home/whiteboard,moral-speak-flow/whiteboard,moral-speak-flow/mobile node scripts/check-trial-assets.mjs
          else
            node scripts/check-trial-assets.mjs
          fi

      - name: Assess functional QA results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const reportPath = "qa-artifacts/latest/report.json";
          const assetPath = "qa-artifacts/latest/trial-assets-report.json";
          if (!fs.existsSync(reportPath) || !fs.existsSync(assetPath)) {
            throw new Error("Classroom QA did not produce the required reports");
          }
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const assets = JSON.parse(fs.readFileSync(assetPath, "utf8"));
          const warnings = (report.results || []).flatMap((result) => result.warnings || []);
          const softwareRenderWarning = /^home (?:frame sample is low: [\d.]+ FPS|active (?:wheel|drag) frame (?:sample is low: [\d.]+ FPS|gap is high: [\d.]+ ms)|sustained drag (?:frame sample is low: [\d.]+ FPS|p99 frame gap is high: [\d.]+ ms))$/;
          const allowedPerformanceWarnings = warnings.filter((warning) => softwareRenderWarning.test(warning));
          const blockingWarnings = warnings.filter((warning) => !softwareRenderWarning.test(warning));
          const blockingAssetFailures = (assets.failures || []).filter(
            (failure) => !/warningCount must be 0| has warnings:/.test(failure),
          );
          if (report.issueCount !== 0 || blockingWarnings.length > 0 || blockingAssetFailures.length > 0) {
            console.error(JSON.stringify({ issueCount: report.issueCount, blockingWarnings, blockingAssetFailures }, null, 2));
            process.exit(1);
          }
          console.log(`Functional QA passed; ${allowedPerformanceWarnings.length} software-rendering warning(s) retained in artifacts.`);
          NODE

      - name: Run production preview smoke
        if: ${{ !cancelled() }}
        run: npm run qa:preview-smoke

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Classroom QA"
            echo
            echo "- Profile: $QA_PROFILE"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Raw classroom QA outcome: ${{ steps.trial.outcome }}"
            echo "- Raw asset QA outcome: ${{ steps.trial-assets.outcome }}"
            echo "- Artifacts: screenshots and JSON reports retained for 14 days"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload classroom QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: classroom-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-artifacts/latest/
          if-no-files-found: warn
          retention-days: 14
